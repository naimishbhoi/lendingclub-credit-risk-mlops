version: 1

pipeline:
  # ------------------------------------------------------
  # STEP 1 - Column Filtering
  # ------------------------------------------------------
  - name: select_eligible_features
    type: column_selector
    source: artifacts/features/eligible_features.csv

  # ------------------------------------------------------
  # STEP 2 - Dtype Enforcement (CRITICAL)
  # ------------------------------------------------------
  - name: dtype_enforcer
    type: dtype_enforcer

  # ------------------------------------------------------
  # STEP 3 - Target Mapping
  # ------------------------------------------------------
  - name: target_mapper
    type: label_mapper
    source_column: loan_status
    output_column: target
    mapping_source: src/contracts/target_contract.yaml
    drop_source_column: true

  # ------------------------------------------------------
  # STEP 4 - FICO Feature Engineering
  # ------------------------------------------------------
  - name: fico_score
    type: fico_score_transformer
    low_column: fico_range_low
    high_column: fico_range_high
    output_column: fico_score
    drop_source_columns: false

  # ------------------------------------------------------
  # STEP 5 - Credit History Length
  # ------------------------------------------------------
  - name: credit_history_length
    type: credit_history_length_transformer
    start_column: earliest_cr_line
    end_column: issue_d
    output_column: credit_history_length_years
    null_policy: preserve_null
    invalid_negative_policy: fail

  # ------------------------------------------------------
  # STEP 6 - Issue Year Extraction
  # ------------------------------------------------------
  - name: issue_year_extractor
    type: issue_year_transformer
    source_column: issue_d
    output_column: issue_year

  # ------------------------------------------------------
  # STEP 7 - Numerical Imputation
  # ------------------------------------------------------
  - name: numerical_imputer
    type: numerical_imputer
    strategy: median
    exclude_columns:
      - target

  # ------------------------------------------------------
  # STEP 8 - Log Transform
  # ------------------------------------------------------
  - name: log_transformer
    type: log_transformer
    method: log1p
    columns:
      - loan_amnt
      - annual_inc
      - revol_bal
      - total_bal_ex_mort

  # ------------------------------------------------------
  # STEP 9 - Frequency Encoding (High Cardinality)
  # ------------------------------------------------------
  - name: frequency_encoder
    type: frequency_encoder
    columns:
      - addr_state
      - purpose
    persist_mappings: true

  # ------------------------------------------------------
  # STEP 10 - One Hot Encoding (Low Cardinality)
  # ------------------------------------------------------
  - name: one_hot_encoder
    type: one_hot_encoder
    exclude_columns:
      - addr_state
      - purpose
    max_cardinality: 20
    handle_unknown: ignore
    drop_original_columns: true

  # ------------------------------------------------------
  # STEP 11 - Drop Raw Columns
  # ------------------------------------------------------
  - name: cleanup
    type: column_dropper
    drop_original_categorical: true
    drop_datetime: true
    additional_columns:
      - fico_range_low
      - fico_range_high
      - issue_d
      - earliest_cr_line
