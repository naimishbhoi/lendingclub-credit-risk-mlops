version: 2

dataset_name: "lendingclub_loan_data"
description: >
  Raw LandingClub loan dataset used for credit risk modeling.

# -----------------------------------------------------
# Sorce Metadata
# -----------------------------------------------------
source:
  format: csv
  encoding: utf-8
  compression: gzip


# -----------------------------------------------------
# Primary Key
# -----------------------------------------------------
primary_key:
  column: id
  enforce_non_null: true
  enforce_uniqueness: true


# -----------------------------------------------------
# Event Time (used for drift analysis) & Labelling
# -----------------------------------------------------
event_time:
  column: issue_d
  type: datetime
  granularity: month
  enforce_non_null: true

label:
  column: loan_status
  required: true


# -----------------------------------------------------
# Column Definitions
# -----------------------------------------------------
columns:
  id:
    type: integer
    required: true
    unique: true
    min: 1

  issue_d:
    type: datetime
    required: true
    format: "%b-%Y"

  loan_amnt:
    type: float
    required: true
    min: 500
    max: 100000

  term:
    type: categorical
    required: true
    allowed_values:
      - "36 months"
      - "60 months"

  grade:
    type: categorical
    required: true
    allowed_values:
      - "A"
      - "B"
      - "C"
      - "D"
      - "E"
      - "F"
      - "G"

  sub_grade:
    type: string
    required: true
    min_length: 1
    max_length: 3

  emp_length:
    type: categorical
    required: false
    allowed_values:
      - "< 1 year"
      - "1 year"
      - "2 years"
      - "3 years"
      - "4 years"
      - "5 years"
      - "6 years"
      - "7 years"
      - "8 years"
      - "9 years"
      - "10+ years"

  home_ownership:
    type: categorical
    required: true
    allowed_values:
      - "RENT"
      - "OWN"
      - "MORTGAGE"
      - "OTHER"
      - "NONE"
      - "ANY"

  annual_inc:
    type: float
    required: true
    enforce_non_null: false
    min: 0

  dti:
    type: float
    required: true
    min: 0
    max: 200

  verification_status:
    type: categorical
    required: true
    allowed_values:
      - "Verified"
      - "Source Verified"
      - "Not Verified"

  loan_status:
    type: categorical
    required: true


# -----------------------------------------------------
# Dataset-level Constraints
# -----------------------------------------------------
constraints:
  min_rows: 100000
  max_missing_ratio: 0.75
  enforce_strict_column_set: false
