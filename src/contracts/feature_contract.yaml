version: 1

feature_set_name: "lendingclub_eligible_features_pipeline"
description: >
  Contract defining input expectations, feature boundary, derived features,
  transformation policy, and output guarantees for the LendingClub feature pipeline.


# -----------------------------------------------------
# INPUT CONTRACT
# -----------------------------------------------------
inputs:
  source: data/interim/<run_id>/validated_dataset.parquet

  feature_boundary_source: artifacts/features/eligible_features.csv

  enforce_strict_column_set: true

  mode_rules:
    train:
      require_target: true
      forbid_target_presence: true

    inference:
      require_target: false
      forbid_target_presence: true

  columns:
    # -----------------------------------------------------
    # NUMERICAL
    # -----------------------------------------------------1
    loan_amnt:
      dtype: float64
      nullable: false
      transformation: log1p

    int_rate:
      dtype: float64
      nullable: false

    annual_inc:
      dtype: float64
      nullable: true
      transformation: log1p

    dti:
      dtype: float64
      nullable: false

    revol_bal:
      dtype: float64
      nullable: false
      transformation: log1p

    revol_util:
      dtype: float64
      nullable: true

    total_acc:
      dtype: float64
      nullable: false

    tot_cur_bal:
      dtype: float64
      nullable: true

    total_rev_hi_lim:
      dtype: float64
      nullable: true

    bc_open_to_buy:
      dtype: float64
      nullable: true

    bc_util:
      dtype: float64
      nullable: true

    total_bal_ex_mort:
      dtype: float64
      nullable: true
      transformation: log1p

    total_bc_limit:
      dtype: float64
      nullable: true

    fico_range_low:
      dtype: float64
      nullable: false

    fico_range_high:
      dtype: float64
      nullable: false

    # -----------------------------------------------------
    # COUNT/DISCRETE
    # -----------------------------------------------------
    delinq_2yrs:
      dtype: int64
      nullable: false

    inq_last_6mths:
      dtype: int64
      nullable: false

    open_acc:
      dtype: int64
      nullable: false

    pub_rec:
      dtype: int64
      nullable: false

    acc_open_past_24mths:
      dtype: int64
      nullable: true

    mort_acc:
      dtype: int64
      nullable: true

    num_actv_bc_tl:
      dtype: int64
      nullable: true

    num_actv_rev_tl:
      dtype: int64
      nullable: true

    num_bc_tl:
      dtype: int64
      nullable: true

    pub_rec_bankruptcies:
      dtype: int64
      nullable: true

    # -----------------------------------------------------
    # CATEGORICAL
    # -----------------------------------------------------
    term:
      dtype: categorical
      nullable: false

    emp_length:
      dtype: categorical
      nullable: true

    home_ownership:
      dtype: categorical
      nullable: false

    verification_status:
      dtype: categorical
      nullable: false

    purpose:
      dtype: categorical
      nullable: false

    addr_state:
      dtype: categorical
      nullable: false

    # -----------------------------------------------------
    # TEMPORAL
    # -----------------------------------------------------
    earliest_cr_line:
      dtype: datetime64[ns]
      nullable: true

    issue_d:
      dtype: datetime64[ns]
      nullable: false

    # -----------------------------------------------------
    # TARGET VALIDATION
    # -----------------------------------------------------
    loan_status:
      dtype: categorical
      nullable: false


# -----------------------------------------------------
# TARGET
# -----------------------------------------------------
targets:
  loan_status:
    output_column: target
    dtype: int64
    nullable: false
    allowed_values: [0, 1]
    train_only: true
    mapping_source: src/contracts/target_contract.yaml


# -----------------------------------------------------
# DROP COLUMNS AFTER TARGET CREATION
# -----------------------------------------------------
drop_columns:
  - loan_status


# -----------------------------------------------------
# Derived Features
# -----------------------------------------------------
derived_features:
  fico_score:
    dtype: float64
    nullable: false
    source_columns:
      - fico_range_low
      - fico_range_high
    method: average_fico_range

  issue_year:
    dtype: int64
    nullable: false
    source_column: issue_d
    method: extract_year

  credit_history_length_years:
    dtype: float64
    nullable: true
    source_columns:
      - earliest_cr_line
      - issue_d
    method: years_difference


# -----------------------------------------------------
# TRANSFORMATION CONTRACT
# -----------------------------------------------------
transformations:
  numerical:
    log_transform:
      method: log1p
      columns:
        - loan_amnt
        - annual_inc
        - revol_bal
        - total_bal_ex_mort

    imputation:
      strategy: median

  categorical:
    encoding:
      strategy: one_hot_low_cardinality
      max_cardinality: 20
      handle_unknown: ignore
      drop_original_columns: true

    frequency_encoding:
      apply_to:
        - addr_state
        - purpose
      persist_mappings: true
      unknown_value: 0.0

  temporal:
    derived_features:
      - credit_history_length_years
      - issue_year


# -----------------------------------------------------
# OUTPUT CONTRACT
# -----------------------------------------------------
outputs:
  include_target: true
  enforce_no_nulls: true

  expected_feature_types:
    numerical: float64
    categorical_encoded: int64

  guarantees:
    deterministic: true
    no_leakage: true
    train_inference_parity: true
    schema_stability: true


# -----------------------------------------------------
# STATISTICS EXCEPTIONS
# -----------------------------------------------------
statistics:
  loan_amnt: {min: 500, max: 100000}
  dti: {min: 0, max: 200}
  annual_inc: {min: 0}
  fico_score: {min: 300, max: 850}

# -----------------------------------------------------
# MONITORING / DRIFT
# -----------------------------------------------------
monitoring:
  enable_drift_detection: true
  drift_method:
    - numerical: psi
    - categorical: jensen_shannon
    - target: kl_divergence
  reference_window: train


# -----------------------------------------------------
# GLOBAL CONTRACT SETTINGS
# -----------------------------------------------------
constraints:
  max_feature_count: 500
  min_feature_count: 20

  forbid_raw_categorical_output: true
  forbid_datetime_output: true

  require_all_transformations_logged: true
  require_feature_contract_validation: true
  require_schema_versioning: true
