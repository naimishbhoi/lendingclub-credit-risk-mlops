version: "1.0.0"

feature_set_name: "lendingclub_eligible_features_pipeline"
description: >
  Contract defining input expectations, feature boundary, derived features,
  transformation policy, and output guarantees for the LendingClub feature pipeline.

schema_hash: auto

# -----------------------------------------------------
# INPUT CONTRACT
# -----------------------------------------------------
inputs:
  source: data/interim/<run_id>/validated_dataset.parquet

  feature_boundary_source: artifacts/features/eligible_features.csv

  enforce_strict_column_set: true

  mode_rules:
    train:
      require_target_source: true
      forbid_mapped_target_input: true

    test:
      require_target_source: true
      forbid_mapped_target_input: true

    inference:
      require_target_source: false
      forbid_target_source: true
      forbid_mapped_target_input: true

  columns:
    # -----------------------------------------------------
    # NUMERICAL
    # -----------------------------------------------------
    loan_amnt:
      dtype: float64
      nullable: false

    int_rate:
      dtype: float64
      nullable: false

    annual_inc:
      dtype: float64
      nullable: true

    dti:
      dtype: float64
      nullable: false

    revol_bal:
      dtype: float64
      nullable: false

    revol_util:
      dtype: float64
      nullable: true

    total_acc:
      dtype: float64
      nullable: false

    tot_cur_bal:
      dtype: float64
      nullable: true

    total_rev_hi_lim:
      dtype: float64
      nullable: true

    bc_open_to_buy:
      dtype: float64
      nullable: true

    bc_util:
      dtype: float64
      nullable: true

    total_bal_ex_mort:
      dtype: float64
      nullable: true

    total_bc_limit:
      dtype: float64
      nullable: true

    fico_range_low:
      dtype: float64
      nullable: false

    fico_range_high:
      dtype: float64
      nullable: false

    pct_tl_nvr_dlq:
      dtype: float64
      nullable: true

    percent_bc_gt_75:
      dtype: float64
      nullable: true

    mths_since_last_delinq:
      dtype: float64
      nullable: true

    mths_since_recent_inq:
      dtype: float64
      nullable: true

    # -----------------------------------------------------
    # COUNT/DISCRETE
    # -----------------------------------------------------
    delinq_2yrs:
      dtype: int64
      nullable: false

    inq_last_6mths:
      dtype: int64
      nullable: false

    open_acc:
      dtype: int64
      nullable: false

    pub_rec:
      dtype: int64
      nullable: false

    acc_open_past_24mths:
      dtype: Int64
      nullable: true

    mort_acc:
      dtype: Int64
      nullable: true

    mo_sin_rcnt_tl:
      dtype: Int64
      nullable: true

    num_actv_bc_tl:
      dtype: Int64
      nullable: true

    num_actv_rev_tl:
      dtype: Int64
      nullable: true

    num_bc_tl:
      dtype: Int64
      nullable: true

    pub_rec_bankruptcies:
      dtype: Int64
      nullable: true

    # -----------------------------------------------------
    # CATEGORICAL
    # -----------------------------------------------------
    term:
      dtype: categorical
      nullable: false

    emp_length:
      dtype: categorical
      nullable: true

    home_ownership:
      dtype: categorical
      nullable: false

    verification_status:
      dtype: categorical
      nullable: false

    purpose:
      dtype: categorical
      nullable: false

    addr_state:
      dtype: categorical
      nullable: false

    # -----------------------------------------------------
    # TEMPORAL
    # -----------------------------------------------------
    earliest_cr_line:
      dtype: datetime64[ns]
      nullable: true

    issue_d:
      dtype: datetime64[ns]
      nullable: false

  # -----------------------------------------------------
  # TARGET VALIDATION
  # -----------------------------------------------------
  staging_column:
    loan_status:
      dtype: categorical
      nullable: false
      train_only: true
      role: target_source


# -----------------------------------------------------
# TARGET
# -----------------------------------------------------
targets:
  default:
    source_column: loan_status
    output_column: target
    dtype: int64
    nullable: false
    allowed_values: [0, 1]
    mapping_source: src/contracts/target_contract.yaml


# -----------------------------------------------------
# Derived Features
# -----------------------------------------------------
derived_features:
  fico_score:
    dtype: float64
    nullable: false
    source_columns:
      - fico_range_low
      - fico_range_high
    method: average_fico_range
    persistent: true

  issue_year:
    dtype: int64
    nullable: false
    source_column: issue_d
    method: extract_year
    persistent: true

  credit_history_length_years:
    dtype: float64
    nullable: false
    source_columns:
      - earliest_cr_line
      - issue_d
    method: years_difference
    persistent: true


# -----------------------------------------------------
# TRANSFORMATION CONTRACT
# -----------------------------------------------------
transformations:
  random_seed: 42

  numerical:
    log_transform:
      method: log1p
      columns:
        - loan_amnt
        - annual_inc
        - revol_bal
        - total_bal_ex_mort
        - tot_cur_bal
        - total_rev_hi_lim
        - total_bc_limit
        - bc_open_to_buy

    imputation:
      strategy: median

  categorical:
    encoding:
      strategy: one_hot_low_cardinality
      max_cardinality: 20
      handle_unknown: ignore
      drop_original_columns: true

    frequency_encoding:
      apply_to:
        - addr_state
        - purpose
      persist_mappings: true
      unknown_value: 0.0

  temporal:
    derived_features:
      - credit_history_length_years
      - issue_year
    drop_original_columns: true


# -----------------------------------------------------
# OUTPUT CONTRACT
# -----------------------------------------------------
outputs:
  mode_rules:
    train:
      include_target: true

    test:
      include_target: true

    inference:
      include_target: false

  enforce_no_nulls: true

  preserve_column_order: true
  preserve_feature_names: true
  preserve_feature_order: true

  expected_feature_types:
    numerical: float64
    one_hot_encoded: int64
    frequency_encoded: float64

  guarantees:
    deterministic: true
    no_leakage: true
    train_inference_parity: true
    schema_stability: true


# -----------------------------------------------------
# FEATURE STATISTICAL CONSTRAINTS
# -----------------------------------------------------
statistics:
  loan_amnt: {min: 500, max: 100000}
  dti: {min: 0, max: 200}
  annual_inc: {min: 0}
  int_rate: {min: 0, max: 100}
  revol_util: {min: 0, max: 200}
  pct_tl_nvr_dlq: {min: 0, max: 100}
  percent_bc_gt_75: {min: 0, max: 100}

  fico_range_low: {min: 300, max: 850}
  fico_range_high: {min: 300, max: 850}

  fico_score: {min: 300, max: 850}
  issue_year: {min: 2007}
  credit_history_length_years: {min: 0}


# -----------------------------------------------------
# FEATURE LINEAGE
# -----------------------------------------------------
lineage:
  generated_from:
    fico_score:
      - fico_range_low
      - fico_range_high

    issue_year:
      - issue_d

    credit_history_length_years:
      - earliest_cr_line
      - issue_d


# -----------------------------------------------------
# ARTIFACTS
# -----------------------------------------------------
artifacts:
  persist:
    imputer: true
    encoder: true
    frequency_encoder: true
    feature_names: true
    training_statistics: true
    schema_snapshot: true
    feature_contract_snapshot: true


# -----------------------------------------------------
# MONITORING / DRIFT
# -----------------------------------------------------
monitoring:
  enable_drift_detection: true
  monitor_derived_features: true

  drift_method:
    numerical: psi
    categorical: jensen_shannon
    target: kl_divergence

  reference_window: train


# -----------------------------------------------------
# GLOBAL CONTRACT SETTINGS
# -----------------------------------------------------
constraints:
  max_feature_count: 500
  min_feature_count: 20

  enforce_no_duplicate_columns: true

  forbid_raw_categorical_output: true
  forbid_datetime_output: true
  forbid_staging_columns_output: true
  forbid_duplicate_output_features: true

  require_all_derived_features_generated: true
  require_all_transformations_logged: true
  require_feature_contract_validation: true
  require_schema_versioning: true
